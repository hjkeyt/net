<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Netflix — Вход</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a class="logo" href="#">NETFLIX</a>
    </div>
  </header>

  <main class="main">
    <div class="login">
      <h1 class="title">Введите свои данные для входа</h1>
      <p class="subtitle">Или зарегистрируйте новый аккаунт.</p>

      <form class="form" action="#" method="get">
        <input
          class="input"
          type="text"
          name="login"
          placeholder="Адрес эл. почты или номер телефона"
          aria-label="Адрес эл. почты или номер телефона"
        >
        <button class="btn" type="submit">Продолжить</button>
      </form>

      <details class="help">
        <summary>Получить помощь</summary>
        <a href="#">Забыли пароль?</a>
        <a href="#">Забыли адрес эл. почты или номер телефона?</a>
      </details>

      <p class="recaptcha">Эта страница защищена Google reCAPTCHA, чтобы мы знали, что вы не бот.</p>
    </div>
  </main>

</body>
</html>
